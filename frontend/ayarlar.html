    <div class="container">
      <h1>Ayarlar</h1>

      <!-- Add User Form -->
      <form id="addUserForm">
        <h3>Yeni Kullanıcı Ekle</h3>
        <div class="mb-3">
          <label for="firstName" class="form-label">Isim</label>
          <input type="text" class="form-control" id="firstName" placeholder="Isim">
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Soyisim</label>
          <input type="text" class="form-control" id="lastName" placeholder="Soyisim">
        </div>
        <button type="submit" class="btn btn-primary">Ekle</button>
      </form>

      <!-- Remove User Form -->
      <form id="removeUserForm">
        <h3>Kullanıcı Sil</h3>
        <div class="mb-3">
          <label for="userIndex" class="form-label">Kullanıcı Numarası</label>
          <input type="number" class="form-control" id="userIndex" placeholder="Kullanıcı Numarası">
        </div>
        <button type="submit" class="btn btn-danger">Sil</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
