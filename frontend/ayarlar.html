<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"> 
  </head>
  <body>    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">   
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Ana Sayfa</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Yoklama
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="yoklama.html">Günlük</a></li>
                <li><a class="dropdown-item" href="istatistik.html">Istatistik</a></li>
                <li><a class="dropdown-item" href="ayarlar.html">Ayarlar</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1>Ayarlar</h1>

      <!-- Add User Form -->
      <form id="addUserForm">
        <h3>Yeni Talebe Ekle</h3>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="firstName" class="form-label">Isim</label>    
            <input type="text" class="form-control" id="firstName" placeholder="Isim">
          </div>
          <div class="col-md-6 mb-3">
            <label for="lastName" class="form-label">Soyisim</label>
            <input type="text" class="form-control" id="lastName" placeholder="Soyisim">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="birthDate" class="form-label">Doğum Tarihi</label>
            <input type="date" class="form-control" id="birthDate">
          </div>
          <div class="col-md-6 mb-3">
            <label for="season" class="form-label">Sezon</label>
            <select class="form-select" id="season">
              <!-- Generate options from 2018 to 2050 -->
              <script>
                for (let year = 2018; year <= 2050; year++) {
                  document.write(`<option value="${year}/${year + 1}">${year}/${year + 1}</option>`);
                }
              </script>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="className" class="form-label">Sınıf Adı</label>
            <select class="form-select" id="className">
              <option value="kuranikerim">Kuran-ı Kerim</option>
              <option value="hazirlik">Hazırlık</option>
              <option value="ibtidati">İbtidati</option>
              <option value="ihzari">İhzari</option>
              <option value="mevzun_tekamul_alti">Mezun Tekamul Altı</option>
              <option value="tekamul_alti">Tekamul Altı</option>
              <!-- Add more class names as needed -->
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Ekle</button>
      </form>

      <!-- Remove User Form -->
      <form id="removeUserForm" class="mt-4">
        <h3>Talebe Sil</h3>
        <div class="mb-3">
          <label for="userIndex" class="form-label">Talebe Numarası</label>
          <input type="number" class="form-control" id="userIndex" placeholder="Talebe Numarası">
        </div>
        <button type="submit" class="btn btn-danger">Sil</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
