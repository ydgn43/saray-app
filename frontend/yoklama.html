    <h1>Günlük Yoklama</h1>
    <div class="container">
      <div class="row align-items-start">
        <div class="col">
          <!-- Existing form content -->
          <div class="container">
            <div class="row align-items-start">
              <div class="col">
                <form action="">
                  <label for="tarih">Tarih:</label>
                  <input type="date">
                  <input type="submit">
                </form>
              </div>
              <div class="col">
                <select class="form-select" aria-label="Default select example">
                  <option selected>Program</option>
                  <option value="1">Sabah Namazi</option>
                  <option value="2">Ögle Namazi</option>
                  <option value="3">Ikindi Namazi</option>
                  <option value="4">Aksam Namazi</option>
                  <option value="5">Yatsi Namazi</option>
                  <option value="6">Hatim</option>
                </select>
              </div>
            </div>
          </div>
          <!-- Updated table with tbody id="userTableBody" -->
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Isim</th>
                <th scope="col">Soyisim</th>    
                <th scope="col">Var</th>
                <th scope="col">Gec</th>
                <th scope="col">Yok</th>
                <th scope="col">Izinli</th>
                <th scope="col">Sebep</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <!-- User rows will be populated here by script.js -->
            </tbody>
          </table>
        </div>
        <div class="col">
          <!-- Existing statistics table -->
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Isim</th>
                <th scope="col">Yüzdelik</th>
              </tr>
            </thead>
            <tbody>
              <tr class="table-success">
                <th scope="row">1</th>
                <td>Tunahan Altun</td>
                <td>100%</td>
              </tr>
              <tr class="table-success">
                <th scope="row">3</th>
                <td>Tunahan Altun</td>
                <td>100%</td>
              </tr> 
              <tr class="table-warning">
                <th scope="row">2</th>
                <td>Yusuf Emin Dogan</td>
                <td>89%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS and custom script.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
