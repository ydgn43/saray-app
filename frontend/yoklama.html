    <link href="style.css" rel="stylesheet">
  </head>
  <body>  
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">   
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Ana Sayfa</a>

              <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="yoklama.html">Günlük</a></li>

    <h1>Günlük Yoklama</h1>
    <div class="container">
      <div class="row align-items-start">
        <div class="col">
          <div class="container">
            <div class="row align-items-start">
              <div class="col">
                <form id="attendanceFilterForm">
                  <label for="tarih">Tarih:</label>
                  <input type="date" id="attendanceDate" required>
                  <select id="programSelect" class="form-select" aria-label="Default select example" required>
                    <option value="" selected disabled>Program</option>
                    <option value="sabah Namazi">Sabah Namazi</option>
                    <option value="Ögle Namazi">Ögle Namazi</option>
                    <option value="Ikindi Namazi">Ikindi Namazi</option>
                    <option value="Aksam Namazi">Aksam Namazi</option>
                    <option value="Yatsi Namazi">Yatsi Namazi</option>
                    <option value="Hatim">Hatim</option>
                  </select>
                  <button type="submit" class="btn btn-primary">Göster</button>
                </form>
                
            </div>
          </div>
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Grup</th>
                <th scope="col">Isim</th>
                <th scope="col">Soyisim</th>    
                <th scope="col">Var</th>
                <th scope="col">Gec</th>
                <th scope="col">Yok</th>
                <th scope="col">Izinli</th>
                <th scope="col">Sebep</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
          </table>
          <button id="saveButton" class="btn btn-primary">Kaydet</button>
        </div>
        <div class="col">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Isim</th>
                <th scope="col">Yüzdelik</th>
              </tr>
            </thead>
            <tbody id="percentageTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
