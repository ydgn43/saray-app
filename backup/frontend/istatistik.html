<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saray - Istatistik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"> 
  </head>
  <body>    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">   
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Ana Sayfa</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Yoklama
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="yoklama.html">Günlük</a></li>
                <li><a class="dropdown-item" href="istatistik.html">Istatistik</a></li>
                <li><a class="dropdown-item" href="ayarlar.html">Ayarlar</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1>Istatistik</h1>

      <!-- Input fields for date interval -->
      <div class="row mt-3">
        <div class="col-md-6">
          <label for="startDate" class="form-label">Başlangıç Tarihi:</label>
          <input type="date" id="startDate" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="endDate" class="form-label">Bitiş Tarihi:</label>
          <input type="date" id="endDate" class="form-control" required>
        </div>
      </div>
      <button id="calculateAttendanceButton" class="btn btn-primary mt-3">Yoklama Yüzdeliklerini Hesapla</button>

      <!-- Table for listing students and attendance percentages -->
      <div class="row mt-4">
        <div class="col">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">İsim</th>
                <th scope="col">Soyisim</th>
                <th scope="col">Var (%)</th>
                <th scope="col">Izinli (%)</th>
              </tr>
            </thead>
            <tbody id="attendancePercentageTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
