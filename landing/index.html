<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Efendim - Çok Yakında</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    }

    /* Gradient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.15;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: .6;
      }

      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    .fade-up {
      animation: fadeUp .7s ease both;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: .85em;
      background: #60a5fa;
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    .card {
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(37, 99, 235, .4);
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 36px rgba(37, 99, 235, .55);
    }

    /* Countdown */
    .count-box {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      padding: 16px 20px;
      min-width: 72px;
      text-align: center;
    }

    /* Dot pulse */
    .dot-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .dot-wrap::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-ring 1.4s ease-out infinite;
    }
  </style>
</head>

<body>
  <!-- Blobs -->
  <div class="blob" style="width:600px;height:600px;background:#2563eb;top:-200px;left:-200px;"></div>
  <div class="blob" style="width:500px;height:500px;background:#7c3aed;bottom:-150px;right:-150px;"></div>
  <div class="blob"
    style="width:300px;height:300px;background:#0ea5e9;top:50%;left:50%;transform:translate(-50%,-50%);"></div>

  <div class="relative z-10 flex flex-col items-center text-center px-6 py-16 max-w-2xl mx-auto">

    <!-- Logo -->
    <div class="fade-up mb-10" style="animation-delay:.1s">
      <div class="flex items-center gap-3 justify-center">
        <div
          style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,99,235,.5);">
          <img src="/favicon.png" alt="" style="width:26px;height:26px;filter:brightness(0) invert(1);"
            onerror="this.style.display='none'" />
        </div>
        <span style="font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px;">Efendim</span>
      </div>
    </div>

    <!-- Live dot -->
    <div class="fade-up mb-6" style="animation-delay:.2s">
      <div
        style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);">
        <div class="dot-wrap" style="width:8px;height:8px;">
          <span
            style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:block;position:relative;z-index:1;"></span>
        </div>
        <span style="font-size:12px;font-weight:600;color:#4ade80;letter-spacing:.4px;">YAKINDA</span>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="fade-up"
      style="animation-delay:.3s;font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;color:#fff;line-height:1.1;letter-spacing:-1.5px;margin-bottom:20px;">
      Çok Yakında<br />
      <span
        style="background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
        <span id="typed"></span><span class="cursor"></span>
      </span>
    </h1>

    <!-- Subtitle -->
    <p class="fade-up"
      style="animation-delay:.4s;font-size:16px;color:#94a3b8;line-height:1.7;max-width:440px;margin-bottom:40px;">
      Modern dijital yoklama ve öğrenci takip sistemi üzerinde çalışıyoruz. Yeni sürüm çok yakında burada olacak.
    </p>

    <!-- Countdown -->
    <div class="fade-up flex items-center gap-3 mb-10" style="animation-delay:.5s">
      <div class="count-box">
        <div id="days" style="font-size:28px;font-weight:800;color:#fff;line-height:1;">00</div>
        <div style="font-size:10px;color:#64748b;font-weight:600;margin-top:4px;letter-spacing:.5px;">GÜN</div>
      </div>
      <span style="font-size:24px;font-weight:700;color:#334155;">:</span>
      <div class="count-box">
        <div id="hours" style="font-size:28px;font-weight:800;color:#fff;line-height:1;">00</div>
        <div style="font-size:10px;color:#64748b;font-weight:600;margin-top:4px;letter-spacing:.5px;">SAAT</div>
      </div>
      <span style="font-size:24px;font-weight:700;color:#334155;">:</span>
      <div class="count-box">
        <div id="mins" style="font-size:28px;font-weight:800;color:#fff;line-height:1;">00</div>
        <div style="font-size:10px;color:#64748b;font-weight:600;margin-top:4px;letter-spacing:.5px;">DAKİKA</div>
      </div>
      <span style="font-size:24px;font-weight:700;color:#334155;">:</span>
      <div class="count-box">
        <div id="secs" style="font-size:28px;font-weight:800;color:#fff;line-height:1;">00</div>
        <div style="font-size:10px;color:#64748b;font-weight:600;margin-top:4px;letter-spacing:.5px;">SANİYE</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="fade-up flex flex-col sm:flex-row gap-3 items-center" style="animation-delay:.6s">
      <a href="/login" class="btn">
        Giriş Yap
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>
    </div>

    <!-- Footer note -->
    <p class="fade-up" style="animation-delay:.7s;margin-top:48px;font-size:12px;color:#334155;">
      © <span id="year"></span> Efendim · Tüm hakları saklıdır.
    </p>
  </div>

  <script>
    // Year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Typing animation
    const words = ['Geliyor', 'Hazırlanıyor', 'Yenileniyor'];
    let wi = 0, ci = 0, del = false;
    const el = document.getElementById('typed');
    (function type() {
      const w = words[wi];
      el.textContent = del ? w.slice(0, --ci) : w.slice(0, ++ci);
      if (!del && ci === w.length) { del = true; setTimeout(type, 2000); }
      else if (del && ci === 0) { del = false; wi = (wi + 1) % words.length; setTimeout(type, 400); }
      else setTimeout(type, del ? 50 : 110);
    })();

    // Countdown — set your launch date here
    const LAUNCH = new Date('2026-06-01T00:00:00');
    function tick() {
      const diff = LAUNCH - Date.now();
      if (diff <= 0) {
        ['days', 'hours', 'mins', 'secs'].forEach(id => document.getElementById(id).textContent = '00');
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('days').textContent = String(d).padStart(2, '0');
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('mins').textContent = String(m).padStart(2, '0');
      document.getElementById('secs').textContent = String(s).padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>

</html>
